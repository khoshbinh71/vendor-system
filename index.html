<!DOCTYPE html>
 
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه متمرکز مدیریت تامین و منابع - هلدینگ خلیج فارس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#f59e0b;--gold-light:#fde68a;--gold-dark:#d97706;
  --bg:#f8fafc;--white:#ffffff;--gray-50:#f9fafb;--gray-100:#f3f4f6;
  --gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;
  --gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;
  --gray-800:#1f2937;--gray-900:#111827;
  --green:#10b981;--red:#ef4444;--blue:#3b82f6;--orange:#f97316;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 4px 6px rgba(0,0,0,.07);
  --shadow-lg:0 10px 25px rgba(0,0,0,.1);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--gray-800);min-height:100vh}
button{font-family:'Vazirmatn',Tahoma,sans-serif;cursor:pointer}
input,select,textarea{font-family:'Vazirmatn',Tahoma,sans-serif}

/* LOGIN */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f 0%,#0f2027 100%)}
.login-box{background:white;border-radius:20px;padding:40px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:30px}
.login-logo h1{font-size:20px;color:var(–gray-800);font-weight:800;margin-top:12px}
.login-logo p{font-size:13px;color:var(–gray-500);margin-top:4px}
.login-icon{width:64px;height:64px;background:linear-gradient(135deg,var(–gold),var(–gold-dark));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(–gray-700);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:12px 14px;border:1.5px solid var(–gray-200);border-radius:var(–radius-sm);font-size:14px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus{border-color:var(–gold);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(–gold),var(–gold-dark));color:white;border:none;border-radius:var(–radius-sm);font-size:15px;font-weight:700;margin-top:8px;transition:.2s}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}
.login-error{background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:var(–radius-sm);font-size:13px;margin-top:12px;display:none}
.login-footer{text-align:center;font-size:11px;color:var(–gray-400);margin-top:20px}

/* MAIN APP */
#app{display:none}
.header{background:white;border-bottom:2px solid var(–gold);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:var(–shadow)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.header-title{display:flex;align-items:center;gap:12px}
.header-title .icon{width:40px;height:40px;background:linear-gradient(135deg,var(–gold),var(–gold-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title h1{font-size:15px;font-weight:800;color:var(–gray-800)}
.header-title p{font-size:11px;color:var(–gray-500)}
.header-user{display:flex;align-items:center;gap:10px}
.user-badge{background:var(–gray-100);border-radius:20px;padding:6px 12px;font-size:12px;color:var(–gray-600);font-weight:600}
.admin-badge{background:linear-gradient(135deg,var(–gold),var(–gold-dark));color:white}
.logout-btn{background:none;border:1.5px solid var(–gray-200);border-radius:8px;padding:6px 12px;font-size:12px;color:var(–gray-600)}

/* STATS */
.stats-bar{display:flex;gap:12px;padding:16px 24px;background:white;border-bottom:1px solid var(–gray-100);overflow-x:auto}
.stat-card{flex:1;min-width:140px;background:var(–gray-50);border-radius:var(–radius);padding:14px 16px;border:1.5px solid var(–gray-100)}
.stat-card.gold{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:var(–gold-light)}
.stat-num{font-size:24px;font-weight:800;color:var(–gray-800)}
.stat-card.gold .stat-num{color:var(–gold-dark)}
.stat-label{font-size:11px;color:var(–gray-500);margin-top:2px}
.stat-card.red{background:#fef2f2;border-color:#fecaca}
.stat-card.red .stat-num{color:var(–red)}
.stat-card.green{background:#f0fdf4;border-color:#bbf7d0}
.stat-card.green .stat-num{color:var(–green)}

/* TABS */
.tabs{display:flex;gap:4px;padding:12px 24px;background:white;border-bottom:1px solid var(–gray-100);overflow-x:auto}
.tab-btn{padding:8px 16px;border-radius:var(–radius-sm);border:none;font-size:13px;font-weight:600;background:none;color:var(–gray-500);white-space:nowrap;transition:.2s}
.tab-btn.active{background:var(–gold);color:white}
.tab-btn:hover:not(.active){background:var(–gray-100);color:var(–gray-700)}

/* CONTENT */
.content{padding:20px 24px;max-width:1400px;margin:0 auto}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:2;min-width:200px;padding:10px 14px;border:1.5px solid var(–gray-200);border-radius:var(–radius-sm);font-size:13px;outline:none}
.search-input:focus{border-color:var(–gold)}
.filter-select{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid var(–gray-200);border-radius:var(–radius-sm);font-size:13px;outline:none;background:white}
.filter-select:focus{border-color:var(–gold)}
.blacklist-toggle{padding:10px 16px;border-radius:var(–radius-sm);border:1.5px solid var(–gray-200);font-size:13px;font-weight:600;background:white;color:var(–gray-600);transition:.2s}
.blacklist-toggle.active{background:#fee2e2;border-color:#fca5a5;color:var(–red)}
.add-btn{padding:10px 16px;background:var(–gold);color:white;border:none;border-radius:var(–radius-sm);font-size:13px;font-weight:700}

/* TABLE */
.result-count{font-size:12px;color:var(–gray-500);margin-bottom:10px}
.table-wrap{overflow-x:auto;border-radius:var(–radius);border:1.5px solid var(–gray-100)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(–gray-50);padding:10px 12px;text-align:right;color:var(–gray-600);font-weight:700;border-bottom:1.5px solid var(–gray-100);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(–gray-50);vertical-align:middle}
tr:hover td{background:var(–gray-50);cursor:pointer}
tr.blacklisted td{background:#fef2f2}
tr.blacklisted:hover td{background:#fee2e2}
.company-name{font-weight:700;color:var(–blue)}
tr.blacklisted .company-name{color:var(–red)}
.score-badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.score-badge.high{background:#d1fae5;color:#065f46}
.score-badge.mid{background:#fef3c7;color:#92400e}
.score-badge.low{background:#fee2e2;color:#991b1b}
.bl-badge{background:#fee2e2;color:var(–red);border:1px solid #fca5a5;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.delay-ok{color:var(–green);font-weight:600}
.delay-warn{color:var(–orange);font-weight:600}
.delay-bad{color:var(–red);font-weight:600}
.stars{color:var(–gold);font-size:12px}

/* PAGINATION */
.pagination{display:flex;gap:6px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.page-btn{padding:7px 12px;border-radius:var(–radius-sm);border:1.5px solid var(–gray-200);background:white;font-size:13px;font-weight:600;color:var(–gray-600);transition:.2s}
.page-btn.active{background:var(–gold);border-color:var(–gold);color:white}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:white;border-radius:var(–radius-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(–shadow-lg)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(–gray-100);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white}
.modal-header h2{font-size:16px;font-weight:800;color:var(–gray-800)}
.modal-close{background:none;border:none;font-size:20px;color:var(–gray-400);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(–gray-100)}
.modal-body{padding:20px 24px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(–gray-100)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:13px;color:var(–gray-500)}
.detail-value{font-size:13px;font-weight:600;color:var(–gray-800)}
.section-title{font-size:13px;font-weight:700;color:var(–gray-700);margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(–gold)}
.eval-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.eval-item label{font-size:11px;color:var(–gray-500);font-weight:600;display:block;margin-bottom:4px}
.eval-chips{display:flex;flex-wrap:wrap;gap:4px}
.eval-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(–gray-200);background:white;color:var(–gray-600);transition:.2s}
.eval-chip.selected{background:var(–gold);border-color:var(–gold);color:white}
.eval-chip:hover:not(.selected){border-color:var(–gold);color:var(–gold-dark)}
.total-score-box{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid var(–gold-light);border-radius:var(–radius);padding:16px;text-align:center;margin:16px 0}
.total-score-num{font-size:36px;font-weight:900;color:var(–gold-dark)}
.total-score-label{font-size:12px;color:var(–gray-500);margin-top:2px}
.bl-warning{background:#fee2e2;border:1.5px solid #fca5a5;border-radius:var(–radius-sm);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.bl-warning span{font-size:13px;color:var(–red);font-weight:600}
.remove-bl-btn{background:white;border:1.5px solid var(–red);color:var(–red);border-radius:var(–radius-sm);padding:6px 12px;font-size:12px;font-weight:700}

/* AI */
.ai-section{background:var(–gray-50);border-radius:var(–radius);padding:16px;margin-top:16px}
.ai-section h4{font-size:13px;font-weight:700;color:var(–gray-700);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ai-result{font-size:13px;color:var(–gray-700);line-height:1.8;white-space:pre-wrap}
.ai-loading{display:flex;align-items:center;gap:8px;color:var(–gray-500);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(–gray-200);border-top-color:var(–gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* HISTORY */
.history-item{padding:10px 12px;background:var(–gray-50);border-radius:var(–radius-sm);margin-bottom:6px;border-right:3px solid var(–gold)}
.history-item.reset{border-right-color:var(–red);background:#fef2f2}
.history-meta{font-size:11px;color:var(–gray-400);margin-top:3px}

/* AI TAB */
.ai-tab-box{background:white;border-radius:var(–radius-lg);padding:24px;box-shadow:var(–shadow)}
.ai-tab-box h3{font-size:16px;font-weight:800;color:var(–gray-800);margin-bottom:6px}
.ai-tab-box p{font-size:13px;color:var(–gray-500);margin-bottom:16px}
.ai-examples{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ai-example{background:var(–gray-50);border:1.5px solid var(–gray-200);border-radius:20px;padding:6px 14px;font-size:12px;color:var(–gray-600);cursor:pointer;transition:.2s}
.ai-example:hover{border-color:var(–gold);color:var(–gold-dark);background:#fffbeb}
.ai-textarea{width:100%;border:1.5px solid var(–gray-200);border-radius:var(–radius-sm);padding:12px;font-size:14px;min-height:80px;outline:none;resize:vertical}
.ai-textarea:focus{border-color:var(–gold)}
.ai-send-btn{background:var(–gold);color:white;border:none;border-radius:var(–radius-sm);padding:12px 24px;font-size:14px;font-weight:700;margin-top:10px}
.ai-response{background:var(–gray-50);border-radius:var(–radius);padding:20px;margin-top:16px;font-size:14px;color:var(–gray-700);line-height:1.9;white-space:pre-wrap;border-right:3px solid var(–gold)}

/* REPORT TAB */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.report-card{background:white;border-radius:var(–radius);padding:20px;box-shadow:var(–shadow);border-top:3px solid var(–gold)}
.report-card h4{font-size:14px;font-weight:700;color:var(–gray-700);margin-bottom:12px}
.report-stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(–gray-50)}
.report-stat:last-child{border-bottom:none}

/* DASHBOARD TAB */
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dash-card{background:white;border-radius:var(–radius-lg);padding:20px;box-shadow:var(–shadow)}
.dash-card h3{font-size:14px;font-weight:800;color:var(–gray-700);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(–gray-100)}
.top-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(–gray-50)}
.top-item-name{font-size:13px;font-weight:600;color:var(–gray-700)}
.top-item-score{font-size:13px;font-weight:800}

/* ADD FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}
.save-btn{background:var(–gold);color:white;border:none;border-radius:var(–radius-sm);padding:12px 24px;font-size:14px;font-weight:700;margin-top:8px}
.cancel-btn{background:white;border:1.5px solid var(–gray-200);border-radius:var(–radius-sm);padding:12px 24px;font-size:14px;font-weight:600;color:var(–gray-600);margin-top:8px;margin-right:8px}

/* COMPARE */
.compare-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid var(–gold);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:150;display:none}
.compare-chips{display:flex;gap:8px;flex-wrap:wrap}
.compare-chip{background:var(–gold-light);border:1.5px solid var(–gold);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(–gold-dark)}
.compare-chip button{background:none;border:none;margin-right:4px;cursor:pointer;font-size:14px}
.compare-btn{background:var(–gold);color:white;border:none;border-radius:var(–radius-sm);padding:10px 20px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.compare-btn:disabled{opacity:.4;cursor:not-allowed}
.clear-compare{background:none;border:none;color:var(–gray-500);font-size:12px;text-decoration:underline}
</style>

</head>
<body>

<!-- LOGIN -->

<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-icon">⚙️</div>
      <h1>سامانه مدیریت تامین‌کنندگان</h1>
      <p>هلدینگ خلیج فارس</p>
    </div>
    <div class="form-group">
      <label>نام کاربری</label>
      <input type="text" id="loginUser" placeholder="نام کاربری را وارد کنید">
    </div>
    <div class="form-group">
      <label>رمز عبور</label>
      <input type="password" id="loginPass" placeholder="رمز عبور را وارد کنید">
    </div>
    <div class="form-group" id="loginCatGroup" style="display:none">
      <label>حوزه تخصصی شما</label>
      <select id="loginCat">
        <option value="">انتخاب کنید</option>
      </select>
    </div>
    <div class="form-group" id="loginNameGroup" style="display:none">
      <label>نام و نام خانوادگی</label>
      <input type="text" id="loginName" placeholder="مثال: علی محمدی">
    </div>
    <div class="form-group" id="loginPersonnelGroup" style="display:none">
      <label>شماره پرسنلی</label>
      <input type="text" id="loginPersonnel" placeholder="مثال: 1234">
    </div>
    <div id="loginError" class="login-error">نام کاربری یا رمز عبور اشتباه است</div>
    <button class="login-btn" onclick="doLogin()">ورود به سامانه</button>
    <div class="login-footer">تمامی حقوق محفوظ است — هلدینگ خلیج فارس ۱۴۰۴</div>
  </div>
</div>

<!-- MAIN APP -->

<div id="app">
  <div class="header">
    <div class="header-inner">
      <div class="header-title">
        <div class="icon">⚙️</div>
        <div>
          <h1>سامانه متمرکز مدیریت تامین و منابع</h1>
          <p>هلدینگ خلیج فارس</p>
        </div>
      </div>
      <div class="header-user">
        <span class="user-badge" id="userBadge"></span>
        <button class="logout-btn" onclick="doLogout()">خروج</button>
      </div>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="tabs" id="tabsBar"></div>

  <div class="content" id="mainContent"></div>
</div>

<!-- MODAL -->

<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modalTitle">جزئیات تامین‌کننده</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- COMPARE BAR -->

<div class="compare-bar" id="compareBar">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:700;color:var(--gray-700)">مقایسه:</span>
    <div class="compare-chips" id="compareChips"></div>
    <button class="clear-compare" onclick="clearCompare()">پاک کردن</button>
  </div>
  <button class="compare-btn" id="compareBtn" onclick="doCompare()" disabled>🤖 مقایسه با هوش مصنوعی</button>
</div>

<script>
const CATEGORIES = ["لوله و اتصالات","فلنج","ولو و شیرآلات","پمپ و کمپرسور","مواد شیمیایی و کاتالیست","قطعات یدکی","ابزار دقیق","برق صنعتی","تجهیزات ایمنی","خدمات مهندسی","ملزومات اداری","تجهیزات سرمایه‌ای"];
const PROVINCES = ["تهران","اصفهان","خوزستان","فارس","البرز","مازندران","خراسان رضوی","آذربایجان شرقی","گیلان","کرمان","بوشهر","سیستان و بلوچستان"];
const API_KEY = "aa-fYqbhO2PX44WeC69wOWYsJnylMUKcUkb47ut8Mg2JhPjmUqt";
const ADMIN_USER = "hoomankhoshbin";
const ADMIN_PASS = "3304024";

function makeEmps(prefix, names) {
  return names.map((name, i) => {
    const code = `${prefix}${String(101+i).padStart(3,"0")}`;
    return {name, personnel: code, pass: code};
  });
}

const PETROCHEMICALS = {
  // شرکت های تولیدی
  "پتروشیمی اروند": { employees: makeEmps("AR", ["علی محمدی","حسن رضایی","فاطمه احمدی","محمد کریمی","زهرا موسوی"]) },
  "پتروشیمی بندر امام": { employees: makeEmps("BI", ["رضا حسینی","مریم صادقی","امیر علوی","سارا قاسمی","جواد نجفی","لیلا رستمی"]) },
  "پتروشیمی بوعلی سینا": { employees: makeEmps("BS", ["محسن اکبری","نسرین فرهادی","داود منصوری","الهام رحیمی","سیامک جعفری"]) },
  "پتروشیمی خوزستان": { employees: makeEmps("KZ", ["حمید زارعی","مینا طاهری","رسول غلامی","آزاده ولی‌پور","مجید صالحی","زینب امیری","کاوه مرادی"]) },

function doLogin() {
  const company = document.getElementById("selCompany").value;
  const err = document.getElementById("loginError");
  err.style.display = "none";

  if (!company) { err.textContent="لطفاً شرکت را انتخاب کنید"; err.style.display="block"; return; }

  if (company === "__admin__") {
    const u = document.getElementById("adminUser")?.value.trim();
    const p = document.getElementById("adminPass")?.value.trim();
    if (u===ADMIN_USER && p===ADMIN_PASS) {
      currentUser = {name:"مدیر سیستم", personnel:"0000", isAdmin:true, company:"ستاد هلدینگ خلیج فارس", category:null};
      startApp();
    } else { err.textContent="نام کاربری یا رمز اشتباه است"; err.style.display="block"; }
    return;
  }

  const empPersonnel = document.getElementById("selEmployee")?.value;
  const empPass = document.getElementById("empPass")?.value.trim();
  if (!empPersonnel) { err.textContent="لطفاً نام کارمند را انتخاب کنید"; err.style.display="block"; return; }
  if (!empPass) { err.textContent="رمز عبور را وارد کنید"; err.style.display="block"; return; }

  const pc = PETROCHEMICALS[company];
  const emp = pc.employees.find(e=>e.personnel===empPersonnel);
  if (!emp || emp.pass !== empPass) { err.textContent="رمز عبور اشتباه است — رمز = شماره پرسنلی"; err.style.display="block"; return; }

  currentUser = {name:emp.name, personnel:emp.personnel, isAdmin:false, company, category:null};
  startApp();
}

  currentUser = null;

function startApp() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("app").style.display = "block";
  const badge = document.getElementById("userBadge");

  if (currentUser.isAdmin) badge.classList.add("admin-badge");
  renderStats();
  renderTabs();
  renderTab("list");
}

// Generate companies
function generateCompanies() {
  const stored = localStorage.getItem("customSuppliers");
  const custom = stored ? JSON.parse(stored) : [];
  const prefixes = ["صنعت","فن‌آور","پیشرو","توسعه","نوآور","صنایع","مهندسی","تکنو","پارس","ایران","آریا","کاسپین","زاگرس","خلیج","سپهر"];
  const mids = ["پترو","نفت","گاز","فولاد","آهن","مس","آلومینیوم","شیمی","انرژی","صنعت","تکنیک","ماشین","قطعه","لوله","پمپ"];
  const suffixes = ["کار","سازان","گستر","آراد","پارس","نو","برتر","کیان","نیک","پور","راد","افزار","تجارت","گروه","سیستم"];
  const companies = [];
  const used = new Set();
  for (let i = 0; i < 1000; i++) {
    let name;
    do {
      const p = prefixes[Math.floor(Math.random()*prefixes.length)];
      const m = mids[Math.floor(Math.random()*mids.length)];
      const s = suffixes[Math.floor(Math.random()*suffixes.length)];
      name = `${p} ${m} ${s}`;
    } while (used.has(name));
    used.add(name);
    const promised = Math.floor(Math.random()*60)+10;
    const actual = Math.max(promised-5, promised + Math.floor(Math.random()*40)-5);
    const delay = Math.max(0, actual-promised);
    const q = +(Math.random()*4+1).toFixed(1);
    const c = +(Math.random()*4+1).toFixed(1);
    const pr = +(Math.random()*4+1).toFixed(1);
    const f = +(Math.random()*4+1).toFixed(1);
    const ds = delay===0?5:delay<=7?4:delay<=15?3:delay<=30?2:1;
    const total = +((q+c+pr+f+ds)/5).toFixed(2);
    companies.push({
      id:`IR-${String(1000+i).padStart(4,"0")}`,name,
      category:CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)],
      province:PROVINCES[Math.floor(Math.random()*PROVINCES.length)],
      phone:`021-${Math.floor(10000000+Math.random()*89999999)}`,
      promisedDays:promised,actualDays:actual,delay,
      quality:q,communication:c,pricing:pr,followup:f,delayScore:ds,total,
      projects:Math.floor(Math.random()*30)+1,isCustom:false
    });
  }
  return [...companies,...custom];
}

const ALL = generateCompanies();

function getRatings(id) {
  const s = localStorage.getItem("ratings_"+id);
  return s ? JSON.parse(s) : {};
}
function saveRatings(id, r) {
  localStorage.setItem("ratings_"+id, JSON.stringify(r));
}
function getHistory(id) {
  const s = localStorage.getItem("history_"+id);
  return s ? JSON.parse(s) : [];
}
function addHistory(id, entry) {
  let h = getHistory(id);
  h.unshift(entry);
  if (h.length > 100) h = h.slice(0,100);
  localStorage.setItem("history_"+id, JSON.stringify(h));
}

function getEffectiveSupplier(s) {
  const r = getRatings(s.id);
  const quality = r.quality !== undefined ? r.quality : s.quality;
  const communication = r.communication !== undefined ? r.communication : s.communication;
  const pricing = r.pricing !== undefined ? r.pricing : s.pricing;
  const followup = r.followup !== undefined ? r.followup : s.followup;
  const delayScore = r.delayScore !== undefined ? r.delayScore : s.delayScore;
  const total = +((quality+communication+pricing+followup+delayScore)/5).toFixed(2);
  return {...s,quality,communication,pricing,followup,delayScore,total,ratings:r};
}

function getFiltered() {
  let list = ALL.map(getEffectiveSupplier);
  if (!currentUser.isAdmin && filterCat) list = list.filter(s => s.category === filterCat);
  if (filterSearch) list = list.filter(s => s.name.includes(filterSearch)||s.id.includes(filterSearch));
  if (filterCat && currentUser.isAdmin) list = list.filter(s => s.category === filterCat);
  if (filterProv) list = list.filter(s => s.province === filterProv);
  if (showBLOnly) list = list.filter(s => s.total < 2.5);
  list.sort((a,b) => sortBy==="delay" ? a.delay-b.delay : b[sortBy]-a[sortBy]);
  return list;
}

function renderStats() {
  const list = ALL.map(getEffectiveSupplier);
  const scope = currentUser.isAdmin ? list : list.filter(s => s.category === currentUser.category);
  const avg = (scope.reduce((s,c)=>s+c.total,0)/scope.length).toFixed(1);

function renderTabs() {

  document.getElementById("tabsBar").innerHTML = tabs.map(([id,label])=>
    `<button class="tab-btn${currentTab===id?" active":""}" onclick="renderTab('${id}')">${label}</button>`

function renderTab(tab) {
  currentTab = tab;

  const c = document.getElementById("mainContent");

function exportCSV(){
  const filtered = getFiltered();
  const rows = [["کد","نام شرکت","دسته‌بندی","استان","کیفیت","ارتباط","قیمت","پیگیری","تحویل","امتیاز کل","وضعیت"]];
  filtered.forEach(s=>{
    rows.push([s.id,s.name,s.category,s.province,s.quality,s.communication,s.pricing,s.followup,s.delayScore,s.total,s.total<2.5?"لیست سیاه":"فعال"]);
  });
  const csv = "\uFEFF"+rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `suppliers-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function callAI(prompt){
  try{
    const res = await fetch("https://api.avalai.ir/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
      body:JSON.stringify({model:"gpt-4o-mini",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || "پاسخی دریافت نشد.";
  } catch(e){return "خطا در اتصال به هوش مصنوعی.";}
}

<div><span style="color:var(--red);font-weight:800;margin-left:6px">${i+1}.</span><span class="top-item-name">${s.name}</span><br><span style="font-size:11px;color:var(--gray-400)">${s.category}</span></div>
<span class="top-item-score" style="color:var(--red)">${s.total}</span>
</div>`).join("")} </div> <div class="dash-card"> <h3>📊 میانگین امتیاز به تفکیک دسته</h3> ${CATEGORIES.map(cat=>{ const items = list.filter(s=>s.category===cat); const avg = items.length?(items.reduce((s,x)=>s+x.total,0)/items.length).toFixed(1):0; const w = Math.min(100,avg/5*100); return `<div style="margin-bottom:10px">
<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
<span>${cat}</span><span style="font-weight:700">${avg}</span>
</div>
<div style="background:var(--gray-100);border-radius:4px;height:6px">
<div style="background:var(--gold);width:${w}%;height:100%;border-radius:4px"></div>
</div>
</div>`; }).join("")} </div> </div> `;
}

function showModal(title, body){
document.getElementById(“modalTitle”).textContent = title;
document.getElementById(“modalBody”).innerHTML = body;
document.getElementById(“modal”).style.display = “flex”;
}
function closeModal(e){
if(!e || e.target.id===“modal”) document.getElementById(“modal”).style.display = “none”;
}
</script>

</body>
